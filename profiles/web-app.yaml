name: web-app
description: Full-stack web application (Vue 3 + FastAPI/Spring Boot)

generators:
  - ui
  - api

reviewers:
  - ui_reviewer
  - api_reviewer

evaluator_strategies:
  - playwright
  - api_test

templates:
  - vue3
  - fastapi

sprint_types:
  - frontend
  - backend
  - fullstack

quality_checks:
  frontend: [eslint, tsc, prettier]
  backend_java: [checkstyle, archunit]
  backend_python: [ruff, mypy]
  architecture: [ddd_layer_check]
